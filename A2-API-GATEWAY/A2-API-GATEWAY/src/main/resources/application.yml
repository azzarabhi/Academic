server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # ✅ Désactiver le CORS handler natif de Gateway
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
              - HEAD
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Authorization
              - Content-Disposition
              - Content-Type
              - Content-Length
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_FIRST

      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/users/**

        - id: academic-service
          uri: http://localhost:8083
          predicates:
            - Path=/academic/**

        - id: user-service-uploads
          uri: http://localhost:8082
          predicates:
            - Path=/uploads/**

        - id: notification-service
          uri: lb://A6-NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**

        - id: ai-service
          uri: http://localhost:8000
          predicates:
            - Path=/ai/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE