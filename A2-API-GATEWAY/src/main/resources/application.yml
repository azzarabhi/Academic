server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/users/**

        - id: academic-service
          uri: http://localhost:8083
          predicates:
            - Path=/academic/**  
            
        - id: user-service-uploads
          uri: http://localhost:8082
          predicates:
            - Path=/uploads/**   
            
        - id: notification-service
          uri: lb://A6-NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**  
        - id: ai-service
          uri: http://localhost:8000
          predicates:
            - Path=/ai/**     