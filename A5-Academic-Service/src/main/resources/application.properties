spring.application.name=A5-Academic-Service
server.port=8083
spring.datasource.url=jdbc:mysql://localhost:3306/db_academic?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true
# ✅ Vérifier que Eureka est bien configuré
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true



# ════════════════════════════════════════════════════════════════
# ÉTAPE 7 — À ajouter dans application.properties (ou .yml équivalent)
# ════════════════════════════════════════════════════════════════

# Dossier où seront stockés les PDF des ressources (créé automatiquement)
ressources.storage.path=uploads/ressources

# Autoriser l'upload de fichiers jusqu'à 20 Mo (doit être >= à la limite
# vérifiée côté service, sinon Spring rejette la requête avant même
# d'atteindre votre code)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
